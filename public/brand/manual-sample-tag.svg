
<svg width="640" height="800" viewBox="0 0 640 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Aged paper background with fibers and coffee stain -->
  <rect width="640" height="800" fill="#F4F0E8" />
  
  <!-- Subtle border crease -->
  <rect x="24" y="24" width="592" height="752" rx="4" fill="none" stroke="#D1C7B7" stroke-width="2" stroke-dasharray="6 4" />

  <!-- Coffee stain -->
  <ellipse cx="480" cy="220" rx="90" ry="85" fill="none" stroke="#D8C7A5" stroke-width="6" opacity="0.45" />
  <ellipse cx="482" cy="222" rx="80" ry="76" fill="#D8C7A5" opacity="0.12" />

  <!-- Header -->
  <text x="50" y="80" font-family="monospace" font-size="16" font-weight="bold" fill="#786D5E" letter-spacing="3">MANUAL SAMPLE DISPATCH SLIP</text>
  <text x="50" y="112" font-family="monospace" font-size="28" font-weight="900" fill="#1C1814">BATCH-04</text>
  <text x="440" y="112" font-family="monospace" font-size="14" font-weight="bold" fill="#C53030">● UNCONFIRMED</text>

  <line x1="50" y1="135" x2="590" y2="135" stroke="#1C1814" stroke-width="2.5" />

  <!-- Recipient details -->
  <text x="50" y="175" font-family="sans-serif" font-size="13" font-weight="bold" fill="#8C806F" text-transform="uppercase">TO CAFÉ ACCOUNT</text>
  <text x="50" y="210" font-family="sans-serif" font-size="26" font-weight="800" fill="#1C1814">Blue Tokai · Khan Market</text>
  <text x="50" y="235" font-family="sans-serif" font-size="15" fill="#5A5245">Attn: Head Barista (Shift A) · Central Corridor</text>

  <line x1="50" y1="265" x2="590" y2="265" stroke="#E2DACD" stroke-width="1.5" />

  <!-- Dispatch Tracking rows -->
  <text x="50" y="305" font-family="monospace" font-size="15" font-weight="bold" fill="#C53030">[?] OCT 12</text>
  <text x="170" y="305" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1C1814">Dispatched via 3rd-Party Parcel</text>
  <text x="170" y="328" font-family="sans-serif" font-size="13" fill="#786D5E">Courier tracking link lost. Roastery phone check pending.</text>

  <line x1="50" y1="355" x2="590" y2="355" stroke="#E2DACD" stroke-width="1" />

  <text x="50" y="395" font-family="monospace" font-size="15" font-weight="bold" fill="#C53030">[?] OCT 14</text>
  <text x="170" y="395" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1C1814">Left at Reception Gate</text>
  <text x="170" y="418" font-family="sans-serif" font-size="13" fill="#786D5E">No signature obtained. Head barista did not receive box.</text>

  <line x1="50" y1="445" x2="590" y2="445" stroke="#E2DACD" stroke-width="1" />

  <text x="50" y="485" font-family="monospace" font-size="15" font-weight="bold" fill="#8C806F">[—] OCT 21</text>
  <text x="170" y="485" font-family="sans-serif" font-size="16" font-weight="bold" fill="#5A5245">Barista Cupping Score</text>
  <text x="170" y="508" font-family="sans-serif" font-size="13" fill="#9C907F">No record. WhatsApp voice note unlistened.</text>

  <line x1="50" y1="535" x2="590" y2="535" stroke="#E2DACD" stroke-width="1" />

  <text x="50" y="575" font-family="monospace" font-size="15" font-weight="bold" fill="#8C806F">[—] OCT 28</text>
  <text x="170" y="575" font-family="sans-serif" font-size="16" font-weight="bold" fill="#5A5245">Commercial Weekly Reorder</text>
  <text x="170" y="598" font-family="sans-serif" font-size="13" fill="#9C907F">Never called back. Outreach stalled.</text>

  <!-- Big Red Stamp -->
  <g transform="translate(380, 520) rotate(-14)">
    <rect x="-10" y="-10" width="200" height="60" rx="8" fill="none" stroke="#DC2626" stroke-width="3" stroke-dasharray="8 4" opacity="0.85" />
    <text x="10" y="30" font-family="sans-serif" font-size="20" font-weight="900" fill="#DC2626" opacity="0.85" letter-spacing="1">AWAITING CALL</text>
  </g>

  <!-- Barcode footer -->
  <g transform="translate(50, 680)">
    <!-- Fake barcode lines -->
    <rect x="0" y="0" width="4" height="45" fill="#1C1814" />
    <rect x="8" y="0" width="8" height="45" fill="#1C1814" />
    <rect x="22" y="0" width="3" height="45" fill="#1C1814" />
    <rect x="30" y="0" width="6" height="45" fill="#1C1814" />
    <rect x="42" y="0" width="12" height="45" fill="#1C1814" />
    <rect x="60" y="0" width="4" height="45" fill="#1C1814" />
    <rect x="70" y="0" width="8" height="45" fill="#1C1814" />
    <rect x="84" y="0" width="3" height="45" fill="#1C1814" />
    <rect x="94" y="0" width="10" height="45" fill="#1C1814" />
    <rect x="110" y="0" width="5" height="45" fill="#1C1814" />
    <rect x="122" y="0" width="8" height="45" fill="#1C1814" />
    <rect x="136" y="0" width="4" height="45" fill="#1C1814" />
    <text x="0" y="62" font-family="monospace" font-size="11" fill="#786D5E">4 9 0 2 1 8 4 0 9 2 8 1 0 4</text>
    <text x="360" y="62" font-family="sans-serif" font-size="12" font-weight="600" fill="#786D5E">NO CENTRALIZED TELEMETRY</text>
  </g>
</svg>
