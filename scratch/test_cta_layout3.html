<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    margin: 0;
    padding: 60px 30px;
    background: #E5E0F0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    box-sizing: border-box;
  }
  .cta-card {
    position: relative;
    width: 100%;
    max-width: 1120px;
    background: #ffffff;
    border-radius: 32px;
    padding: 88px 48px 76px;
    box-shadow: 0 24px 64px -14px rgba(43, 23, 96, 0.12), 0 0 0 1px rgba(255, 255, 255, 0.9) inset;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    box-sizing: border-box;
  }

  /* ─── 3D Glowing Torus Arcs (Exact match to Image 1) ─── */
  .bcl-arc-svg {
    position: absolute;
    pointer-events: none;
    z-index: 1;
  }
  /* Left arc: dips down and curls up */
  .bcl-arc-left {
    left: -40px;
    top: 50%;
    transform: translateY(-50%);
    width: 380px;
    height: 380px;
  }
  /* Right arc: arches UPWARDS like a dome (exact match to Image 1) */
  .bcl-arc-right {
    right: -40px;
    top: 50%;
    transform: translateY(-50%);
    width: 380px;
    height: 380px;
  }

  /* ─── Pill Badge ─── */
  .cta-pill {
    position: relative;
    z-index: 2;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 16px;
    border-radius: 9999px;
    background: #F8F5FF;
    border: 1px solid rgba(107, 51, 211, 0.2);
    font-size: 13.5px;
    font-weight: 550;
    color: #6B33D3;
    margin-bottom: 24px;
    box-shadow: 0 2px 10px rgba(107, 51, 211, 0.06);
  }
  .cta-pill-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #6B33D3;
    box-shadow: 0 0 8px rgba(107, 51, 211, 0.8);
    animation: pill-pulse 2s infinite ease-in-out;
  }
  @keyframes pill-pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.3); opacity: 0.6; }
  }

  /* ─── Headline & Sub ─── */
  .cta-title {
    position: relative;
    z-index: 2;
    font-size: 58px;
    font-weight: 750;
    line-height: 1.06;
    letter-spacing: -0.04em;
    color: #120A21;
    margin: 0 0 16px 0;
    max-width: 14ch;
  }
  .cta-sub {
    position: relative;
    z-index: 2;
    font-size: 16.5px;
    line-height: 1.55;
    color: #554D68;
    max-width: 540px;
    margin: 0 0 46px 0;
  }

  /* ─── Light Projector Button (Exact match to Reference Image 2) ─── */
  .cta-beam-btn-wrap {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .cta-beam-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    border: 0;
    background: transparent;
    cursor: pointer;
    padding: 0;
    text-decoration: none;
    outline: none;
    filter: drop-shadow(0 16px 36px rgba(107, 51, 211, 0.28));
  }

  /* Left Emitter Capsule: "+ Build" or "+ Launch" */
  .cbb-emitter {
    position: relative;
    z-index: 4;
    display: inline-flex;
    align-items: center;
    gap: 9px;
    height: 54px;
    padding: 0 24px 0 22px;
    background: #090314;
    border: 1.5px solid rgba(168, 85, 247, 0.45);
    border-right: none;
    border-radius: 9999px 0 0 9999px;
    box-shadow: 0 10px 28px -6px rgba(15, 5, 30, 0.45), 0 0 18px rgba(107, 51, 211, 0.25) inset;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .cbb-plus {
    font-size: 21px;
    font-weight: 350;
    color: #C084FC;
    line-height: 1;
    transition: transform 0.35s ease;
  }
  .cbb-action {
    font-size: 17px;
    font-weight: 650;
    color: #ffffff;
    letter-spacing: -0.01em;
  }

  /* Razor-sharp glowing vertical aperture / light slit */
  .cbb-slit {
    position: relative;
    z-index: 6;
    width: 3.5px;
    height: 50px;
    background: #ffffff;
    border-radius: 2px;
    box-shadow: 
      0 0 8px #ffffff,
      0 0 20px #E9D5FF,
      0 0 36px #A855F7,
      0 0 60px #7C3AED;
    transition: all 0.3s ease;
  }

  /* Volumetric Light Beam projecting to the right */
  .cbb-projector-beam {
    position: relative;
    z-index: 3;
    display: inline-flex;
    align-items: center;
    height: 54px;
    padding: 0 36px 0 24px;
    cursor: pointer;
  }

  /* The solid volumetric conical polygon of light */
  .cbb-cone-mesh {
    position: absolute;
    left: -2px;
    top: 50%;
    transform: translateY(-50%);
    width: 380px;
    height: 160px;
    background: linear-gradient(
      90deg,
      rgba(255, 255, 255, 0.98) 0%,
      rgba(216, 180, 254, 0.92) 6%,
      rgba(147, 51, 234, 0.88) 25%,
      rgba(107, 51, 211, 0.78) 55%,
      rgba(88, 28, 135, 0.45) 80%,
      transparent 100%
    );
    clip-path: polygon(0% 34%, 100% 0%, 100% 100%, 0% 66%);
    filter: drop-shadow(0 0 24px rgba(147, 51, 234, 0.6));
    pointer-events: none;
    z-index: 1;
    transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  }

  /* Soft atmospheric halo / glow around the beam */
  .cbb-cone-haze {
    position: absolute;
    left: -10px;
    top: 50%;
    transform: translateY(-50%);
    width: 440px;
    height: 220px;
    background: radial-gradient(
      ellipse 75% 50% at 20% 50%,
      rgba(147, 51, 234, 0.45) 0%,
      rgba(107, 51, 211, 0.22) 50%,
      transparent 80%
    );
    filter: blur(16px);
    pointer-events: none;
    z-index: 0;
    transition: all 0.35s ease;
  }

  /* Text inside the light beam */
  .cbb-beam-text {
    position: relative;
    z-index: 4;
    font-size: 17px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: -0.015em;
    text-shadow: 0 1px 3px rgba(15, 5, 30, 0.4), 0 0 14px rgba(255, 255, 255, 0.8), 0 0 28px rgba(168, 85, 247, 0.8);
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .cbb-beam-arrow {
    display: inline-block;
    font-size: 16px;
    font-weight: 700;
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }

  /* Hover States */
  .cta-beam-btn:hover .cbb-emitter {
    background: #0f0522;
    border-color: rgba(192, 132, 252, 0.8);
    box-shadow: 0 14px 36px -4px rgba(107, 51, 211, 0.6), 0 0 24px rgba(168, 85, 247, 0.35) inset;
  }
  .cta-beam-btn:hover .cbb-plus {
    transform: rotate(90deg) scale(1.2);
    color: #ffffff;
  }
  .cta-beam-btn:hover .cbb-slit {
    height: 56px;
    width: 4px;
    box-shadow: 
      0 0 12px #ffffff,
      0 0 28px #F3E8FF,
      0 0 50px #C084FC,
      0 0 80px #9333EA;
  }
  .cta-beam-btn:hover .cbb-cone-mesh {
    width: 430px;
    height: 185px;
    filter: drop-shadow(0 0 32px rgba(147, 51, 234, 0.85));
  }
  .cta-beam-btn:hover .cbb-cone-haze {
    opacity: 1;
    width: 480px;
  }
  .cta-beam-btn:hover .cbb-beam-arrow {
    transform: translateX(6px);
  }

  /* ─── 3D Perspective Grid Floor (Exact match to Image 2) ─── */
  .cta-grid-floor {
    position: relative;
    width: 560px;
    height: 95px;
    margin-top: 14px;
    overflow: hidden;
    perspective: 320px;
    pointer-events: none;
    mask-image: radial-gradient(ellipse 65% 55% at 50% 25%, black 20%, transparent 80%);
    -webkit-mask-image: radial-gradient(ellipse 65% 55% at 50% 25%, black 20%, transparent 80%);
  }
  .cta-grid-plane {
    position: absolute;
    inset: -60% -20% 0 -20%;
    transform: rotateX(68deg);
    background-size: 28px 28px;
    background-image: 
      linear-gradient(to right, rgba(107, 51, 211, 0.26) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(107, 51, 211, 0.26) 1px, transparent 1px);
  }
  .cta-grid-light-spot {
    position: absolute;
    left: 45%;
    top: 0;
    width: 260px;
    height: 80px;
    background: radial-gradient(ellipse 65% 50% at 30% 20%, rgba(147, 51, 234, 0.4) 0%, transparent 70%);
    filter: blur(10px);
  }

  /* Secondary Question / Note at bottom */
  .cta-footer-note {
    margin-top: 8px;
    font-size: 14.5px;
    font-weight: 550;
    color: #6B33D3;
    opacity: 0.9;
    letter-spacing: -0.01em;
  }
</style>
</head>
<body>

<div class="cta-card">
  <!-- Left 3D Arc (Curves down and sweeps up) -->
  <svg class="bcl-arc-svg bcl-arc-left" viewBox="0 0 380 380" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="arc-grad-l" x1="15%" y1="85%" x2="85%" y2="15%">
        <stop offset="0%" stop-color="#4C1D95" />
        <stop offset="25%" stop-color="#6B33D3" />
        <stop offset="65%" stop-color="#8B5CF6" />
        <stop offset="100%" stop-color="#C084FC" />
      </linearGradient>
      <filter id="arc-shad-l" x="-20%" y="-20%" width="150%" height="150%">
        <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#4C1D95" flood-opacity="0.32" />
      </filter>
    </defs>
    <!-- Circular 3D ring dipping down and curving up -->
    <path d="M 15 190 A 135 135 0 0 0 270 125" 
          stroke="url(#arc-grad-l)" 
          stroke-width="50" 
          stroke-linecap="round" 
          filter="url(#arc-shad-l)" />
  </svg>

  <!-- Right 3D Arc (Inverted dome arching UPWARDS, matching Image 1!) -->
  <svg class="bcl-arc-svg bcl-arc-right" viewBox="0 0 380 380" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="arc-grad-r" x1="15%" y1="15%" x2="85%" y2="85%">
        <stop offset="0%" stop-color="#C084FC" />
        <stop offset="35%" stop-color="#8B5CF6" />
        <stop offset="75%" stop-color="#6B33D3" />
        <stop offset="100%" stop-color="#4C1D95" />
      </linearGradient>
      <filter id="arc-shad-r" x="-20%" y="-20%" width="150%" height="150%">
        <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#4C1D95" flood-opacity="0.3" />
      </filter>
    </defs>
    <!-- Inverted dome arc arching UP on the right -->
    <path d="M 110 255 A 135 135 0 0 1 365 190" 
          stroke="url(#arc-grad-r)" 
          stroke-width="50" 
          stroke-linecap="round" 
          filter="url(#arc-shad-r)" />
  </svg>

  <!-- Pill Chip Badge -->
  <div class="cta-pill">
    <span class="cta-pill-dot"></span>
    <span>Gradient · Café Demand Platform</span>
  </div>

  <!-- Main Headline -->
  <h2 class="cta-title">Start your<br>free trial today</h2>

  <!-- Subtitle -->
  <p class="cta-sub">Unlock the full potential of your brand with verified café demand telemetry and automated reorders.</p>

  <!-- Button with "this light kind of thing" (Image 2) -->
  <div class="cta-beam-btn-wrap">
    <button type="button" class="cta-beam-btn" aria-label="Launch a trial flight">
      <!-- Left side: "+ Build" or "+ Launch" -->
      <span class="cbb-emitter">
        <span class="cbb-plus">+</span>
        <span class="cbb-action">Build</span>
      </span>

      <!-- Glowing Light Aperture / Vertical Slit -->
      <span class="cbb-slit" aria-hidden="true"></span>

      <!-- Right side: The Projector Light Beam with text inside -->
      <span class="cbb-projector-beam">
        <span class="cbb-cone-haze" aria-hidden="true"></span>
        <span class="cbb-cone-mesh" aria-hidden="true"></span>
        <span class="cbb-beam-text">
          <span>Your Brand Identity</span>
          <span class="cbb-beam-arrow">→</span>
        </span>
      </span>
    </button>

    <!-- 3D Perspective Grid Floor below button -->
    <div class="cta-grid-floor" aria-hidden="true">
      <div class="cta-grid-plane"></div>
      <div class="cta-grid-light-spot"></div>
    </div>

    <!-- Subtitle Question -->
    <div class="cta-footer-note">Stuck in your brand growth? Talk with our team.</div>
  </div>
</div>

</body>
</html>
