<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    margin: 0;
    padding: 60px 40px;
    background: #DFDAEB;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    box-sizing: border-box;
  }
  .cta-banner {
    position: relative;
    width: 100%;
    max-width: 1100px;
    background: #ffffff;
    border-radius: 28px;
    padding: 72px 48px;
    box-shadow: 0 20px 50px -10px rgba(43, 23, 96, 0.12), 0 0 0 1px rgba(255, 255, 255, 0.8) inset;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    box-sizing: border-box;
  }
  /* Decorative 3D Arcs */
  .arc-left {
    position: absolute;
    left: -40px;
    top: 20px;
    width: 320px;
    height: 320px;
    pointer-events: none;
  }
  .arc-right {
    position: absolute;
    right: -40px;
    top: 20px;
    width: 340px;
    height: 320px;
    pointer-events: none;
  }
  
  /* Pill badge */
  .cta-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 5px 14px;
    border-radius: 9999px;
    background: #F4F0FF;
    border: 1px solid rgba(107, 51, 211, 0.18);
    font-size: 13px;
    font-weight: 550;
    color: #6B33D3;
    margin-bottom: 24px;
  }
  .cta-pill-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #6B33D3;
    box-shadow: 0 0 8px rgba(107, 51, 211, 0.6);
  }
  
  /* Headline */
  .cta-title {
    font-size: 54px;
    font-weight: 700;
    line-height: 1.08;
    letter-spacing: -0.035em;
    color: #120A21;
    margin: 0 0 16px 0;
    max-width: 14ch;
  }
  .cta-sub {
    font-size: 16px;
    line-height: 1.5;
    color: #554D68;
    max-width: 500px;
    margin: 0 0 36px 0;
  }
</style>
</head>
<body>

<div class="cta-banner">
  <!-- Left 3D Arc -->
  <svg class="arc-left" viewBox="0 0 320 320" fill="none">
    <defs>
      <linearGradient id="arc-grad-left" x1="0%" y1="100%" x2="100%" y2="0%">
        <stop offset="0%" stopColor="#5B21B6" />
        <stop offset="45%" stopColor="#7C3AED" />
        <stop offset="80%" stopColor="#9333EA" />
        <stop offset="100%" stopColor="#C084FC" />
      </linearGradient>
      <filter id="arc-shadow-left" x="-20%" y="-20%" width="150%" height="150%">
        <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#581C87" flood-opacity="0.32" />
      </filter>
    </defs>
    <!-- Smooth curved crescent arc entering from left, dipping and curling up -->
    <path d="M 0,160 C 40,240 120,290 200,240 C 250,210 270,150 250,110 C 235,80 200,80 190,105 C 180,130 200,165 170,195 C 130,230 65,195 20,130 Z" 
          fill="url(#arc-grad-left)" 
          filter="url(#arc-shadow-left)" />
  </svg>

  <!-- Right 3D Arc -->
  <svg class="arc-right" viewBox="0 0 340 320" fill="none">
    <defs>
      <linearGradient id="arc-grad-right" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stopColor="#C084FC" />
        <stop offset="35%" stopColor="#9333EA" />
        <stop offset="70%" stopColor="#7C3AED" />
        <stop offset="100%" stopColor="#4C1D95" />
      </linearGradient>
      <filter id="arc-shadow-right" x="-20%" y="-20%" width="150%" height="150%">
        <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#4C1D95" flood-opacity="0.32" />
      </filter>
    </defs>
    <!-- Arching over from right edge -->
    <path d="M 120,180 C 130,120 180,60 260,65 C 320,70 350,110 360,160 C 370,210 330,240 310,210 C 290,180 300,140 260,120 C 220,100 170,140 150,200 Z" 
          fill="url(#arc-grad-right)" 
          filter="url(#arc-shadow-right)" />
  </svg>

  <div class="cta-pill">
    <span class="cta-pill-dot"></span>
    <span>Dataly best SaaS analytics</span>
  </div>

  <h2 class="cta-title">Start your<br>free trial today</h2>

  <p class="cta-sub">Unlock the full potential of your data with our comprehensive SaaS analytics platform.</p>

  <div style="font-size: 14px; color: #888;">[Button preview here]</div>
</div>

</body>
</html>
