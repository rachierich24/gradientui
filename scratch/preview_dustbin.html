<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    margin: 0;
    padding: 60px;
    background: #0E0720;
    color: white;
    font-family: system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
  }
  .row {
    display: flex;
    gap: 50px;
    align-items: flex-end;
  }
  .bin-card {
    background: #18112C;
    border: 1px solid rgba(139, 92, 246, 0.2);
    border-radius: 20px;
    padding: 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
  }
  .bin-box {
    position: relative;
    width: 120px;
    height: 140px;
  }
  /* Open state */
  .bin-box.open .dustbin-lid {
    transform: rotate(-68deg);
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  /* Closed state */
  .bin-box.closed .dustbin-lid {
    transform: rotate(0deg);
  }

  /* Paper Ball Demo */
  .paper-ball {
    width: 48px;
    height: 48px;
    background: radial-gradient(circle at 35% 35%, #FFFFFF 0%, #E6E1F0 30%, #C4B9DC 70%, #9082B4 100%);
    border-radius: 46% 54% 63% 37% / 41% 59% 43% 57%;
    box-shadow: 
      0 10px 22px rgba(0,0,0,0.5),
      inset -4px -6px 10px rgba(45, 24, 80, 0.5),
      inset 4px 6px 8px rgba(255,255,255,0.85);
    position: relative;
    overflow: hidden;
    transform: rotate(25deg);
  }
  .paper-ball::before {
    content: "";
    position: absolute;
    inset: 0;
    background: 
      linear-gradient(135deg, rgba(0,0,0,0.25) 0%, transparent 20%, rgba(255,255,255,0.4) 22%, transparent 35%),
      linear-gradient(45deg, transparent 40%, rgba(0,0,0,0.3) 50%, rgba(255,255,255,0.5) 54%, transparent 65%),
      linear-gradient(215deg, transparent 30%, rgba(0,0,0,0.3) 45%, transparent 55%);
    mix-blend-mode: multiply;
  }
  .paper-ball::after {
    content: "SAMPLE";
    position: absolute;
    top: 14px;
    left: 4px;
    font-size: 7px;
    font-family: monospace;
    font-weight: bold;
    color: rgba(60, 40, 100, 0.45);
    transform: rotate(-35deg) scale(0.9);
  }
</style>
</head>
<body>
  <h2>Dustbin Visual Design & Paper Ball Test</h2>
  <div class="row">
    <div class="bin-card">
      <div class="bin-box closed">
<svg width="120" height="140" viewBox="0 0 120 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Canister metallic body gradient -->
    <linearGradient id="canBodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#180F2E" />
      <stop offset="25%" stop-color="#321D58" />
      <stop offset="50%" stop-color="#46297A" />
      <stop offset="75%" stop-color="#281648" />
      <stop offset="100%" stop-color="#120A22" />
    </linearGradient>

    <!-- Deep interior void -->
    <radialGradient id="voidGrad" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#241144" />
      <stop offset="65%" stop-color="#0E051D" />
      <stop offset="100%" stop-color="#05010A" />
    </radialGradient>

    <!-- Rim highlight -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="35%" stop-color="#DDD6FE" />
      <stop offset="70%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#5B21B6" />
    </linearGradient>

    <!-- Lid gradient -->
    <linearGradient id="lidGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#3B1F6E" />
      <stop offset="40%" stop-color="#552E9B" />
      <stop offset="100%" stop-color="#1F0F3D" />
    </linearGradient>

    <!-- Handle metallic shine -->
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9CA3AF" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#6B7280" />
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="binShadow" x="-20%" y="-10%" width="140%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#120626" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#6B33D3" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Ground contact shadow -->
  <ellipse cx="60" cy="128" rx="42" ry="8" fill="rgba(15, 6, 32, 0.35)" filter="blur(4px)" />

  <!-- Canister Main Assembly (with squash/bounce pivot at base) -->
  <g class="dustbin-canister" filter="url(#binShadow)">
    <!-- Back of the rim / dark interior hole -->
    <ellipse cx="60" cy="34" rx="40" ry="14" fill="url(#voidGrad)" stroke="#2E1650" stroke-width="1.5" />
    
    <!-- Interior purple vortex glow -->
    <ellipse cx="60" cy="36" rx="26" ry="8" fill="#6B33D3" opacity="0.35" filter="blur(3px)" />

    <!-- Canister Body -->
    <path d="M 20,34 L 27,116 Q 60,126 93,116 L 100,34 Q 60,46 20,34 Z" fill="url(#canBodyGrad)" />

    <!-- Vertical rib flutes for industrial tactile feel -->
    <path d="M 36,39 L 41,118" stroke="rgba(255,255,255,0.09)" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 37.5,39 L 42.5,118" stroke="rgba(0,0,0,0.35)" stroke-width="1.5" stroke-linecap="round" />

    <path d="M 52,41 L 54,120" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 53.5,41 L 55.5,120" stroke="rgba(0,0,0,0.35)" stroke-width="1.5" stroke-linecap="round" />

    <path d="M 68,41 L 66,120" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 69.5,41 L 67.5,120" stroke="rgba(0,0,0,0.35)" stroke-width="1.5" stroke-linecap="round" />

    <path d="M 84,39 L 79,118" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 85.5,39 L 80.5,118" stroke="rgba(0,0,0,0.35)" stroke-width="1.5" stroke-linecap="round" />

    <!-- Base accent ring -->
    <path d="M 27,116 Q 60,126 93,116" stroke="#8B5CF6" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.75" />

    <!-- Front half of the rim (covers falling paper balls) -->
    <path d="M 20,34 Q 60,48 100,34" stroke="url(#rimGrad)" stroke-width="3.5" fill="none" stroke-linecap="round" />
    <path d="M 22,34 Q 60,46 98,34" stroke="rgba(255,255,255,0.4)" stroke-width="1" fill="none" />
  </g>

  <!-- Hinged Lid (rotates open from hinge on right) -->
  <g class="dustbin-lid" style="transform-origin: 98px 30px;">
    <!-- Lid dome -->
    <path d="M 16,30 Q 60,16 104,30 Q 60,38 16,30 Z" fill="url(#lidGrad)" stroke="#4C268A" stroke-width="1.5" />
    <!-- Lid rim lip -->
    <path d="M 14,31 Q 60,41 106,31" stroke="url(#rimGrad)" stroke-width="2.5" fill="none" />
    <!-- Lid handle -->
    <rect x="50" y="16" width="20" height="5" rx="2.5" fill="url(#handleGrad)" stroke="#374151" stroke-width="0.8" />
    <rect x="53" y="14" width="14" height="2" rx="1" fill="#FFFFFF" opacity="0.6" />
  </g>
</svg>
</div>
      <span>Closed Lid</span>
    </div>

</div>
      <span>Open Lid (Ready for Trash)</span>
    </div>
    <div class="bin-card">
      <div style="height: 140px; display: flex; align-items: center; justify-content: center;">
