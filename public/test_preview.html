<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      background: #FAF8F5;
      margin: 0;
      padding: 40px;
      font-family: sans-serif;
    }
    .grid {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 30px;
    }
    .card-wrap {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 16px 36px rgba(0,0,0,0.12);
      background: #fff;
    }
    .supplier-wrap {
      width: 490px;
      aspect-ratio: 16 / 9;
    }
    .mobile-wrap {
      width: 224px;
      height: 460px;
      border-radius: 38px;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>
  <div class="grid">
    <div class="card-wrap supplier-wrap">
      <video id="v1" src="/suppliers.mp4" muted playsinline></video>
    </div>
    <div class="card-wrap mobile-wrap">
      <video id="v0" src="/cafe.mp4" muted playsinline></video>
    </div>
    <div class="card-wrap supplier-wrap">
      <video id="v2" src="/brands.mp4" muted playsinline></video>
    </div>
  </div>
  <script>
    ['v0', 'v1', 'v2'].forEach(id => {
      const v = document.getElementById(id);
      v.addEventListener('loadeddata', () => {
        v.currentTime = 0.5;
      });
    });
  </script>
</body>
</html>
