<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      background: #FAF8F5;
      margin: 0;
      padding: 40px;
      font-family: sans-serif;
    }
    .grid {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 30px;
    }
    .box {
      border: 1px solid #ccc;
      border-radius: 14px;
      overflow: hidden;
      background: #fff;
    }
    .supplier-box {
      width: 480px;
      height: 270px;
      position: relative;
    }
    .mobile-box {
      width: 230px;
      height: 460px;
      position: relative;
      border-radius: 38px;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>
  <h2>Test Video Layout</h2>
  <div class="grid">
    <!-- Supplier -->
    <div class="box supplier-box">
      <video src="/suppliers.mp4" autoplay loop muted playsinline></video>
    </div>
    <!-- Mobile -->
    <div class="box mobile-box">
      <video src="/cafe.mp4" autoplay loop muted playsinline></video>
    </div>
    <!-- Brand -->
    <div class="box supplier-box">
      <video src="/brands.mp4" autoplay loop muted playsinline></video>
    </div>
  </div>
</body>
</html>
